services:
  crapi-modsecurity:
    image: owasp/modsecurity-crs:4.25-apache-lts
    container_name: crapi-modsecurity
    restart: unless-stopped

    environment:
      BACKEND: "http://crapi-web:80"
      PORT: "8080"
      SERVER_NAME: "localhost"

      # İlk aşamada yalnızca tespit ve loglama
      MODSEC_RULE_ENGINE: "On"

      # Başlangıç paranoia seviyesi
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"

      # Denetim kayıtları
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG_TYPE: "Serial"
      MODSEC_AUDIT_LOG: "/var/log/modsec_audit.log"

    ports:
      - "127.0.0.1:8889:8080"

    networks:
      - crapi_network

networks:
  crapi_network:
    external: true
    name: docker_default

